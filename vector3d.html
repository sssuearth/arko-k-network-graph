<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector → 3D Relief</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1c1c1c;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
      }
      #guiToggle {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 36px;
        height: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: rgba(0, 0, 0, 0.3);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        z-index: 30;
      }
      #guiToggle span {
        display: block;
        width: 20px;
        height: 2px;
        background: #fff;
        border-radius: 1px;
      }
      #dropHint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        z-index: 20;
        pointer-events: none;
      }
      #dragOverlay {
        position: fixed;
        inset: 0;
        background: rgba(80, 130, 255, 0.1);
        border: 3px dashed rgba(120, 160, 255, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #cdd9ff;
        z-index: 100;
        pointer-events: none;
      }
      #dragOverlay.active {
        display: flex;
      }
      #loadingOverlay {
        position: fixed;
        inset: 0;
        background: #1c1c1c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: #999;
        z-index: 200;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <button id="guiToggle" aria-label="컨트롤 패널 토글">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div id="dropHint">SVG 파일을 드래그 앤 드롭하거나 패널의 '불러오기' 버튼을 사용하세요</div>
      <div id="dragOverlay">여기에 SVG 파일을 놓으세요</div>
      <div id="loadingOverlay">로딩 중...</div>
    </div>
    <script type="module" src="/src/vector3d/main.js"></script>
  </body>
</html>
